<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spectrum - The Stalker & The Dark Realm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            width: 800px;
            height: 500px;
            border: 8px solid #00FFFF;
            background-color: #000;
        }

        #viewport-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            background-color: #000;
        }

        #click-to-play {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }

        #distance-hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            color: red;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            display: none;
            pointer-events: none;
        }

        #sidebar {
            width: 250px;
            background-color: #FFFF00;
            color: #000;
            border-left: 8px solid #000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            font-size: 22px;
            line-height: 1.4;
        }

        #sidebar h2 {
            margin: 0 0 15px 0;
            font-size: 32px;
            text-align: center;
            text-decoration: underline;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 10px;
        }

        .key {
            background-color: #000;
            color: #fff;
            padding: 2px 6px;
            font-weight: bold;
        }

        #stamina-container {
            margin-top: 25px;
        }
        
        #stamina-title {
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 5px;
        }

        #stamina-bg {
            width: 100%;
            height: 24px;
            background: #444;
            border: 3px solid #000;
            box-sizing: border-box;
        }

        #stamina-fill {
            width: 100%;
            height: 100%;
            background: #00FF00;
            transition: background-color 0.2s;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="viewport-wrapper">
        <canvas id="gameCanvas" width="320" height="200"></canvas>
        <div id="distance-hud">Entidad a: <span id="dist-value">--</span>m</div>
        <div id="click-to-play">CLICK PARA JUGAR</div>
    </div>
    <div id="sidebar">
        <h2>CONTROLES</h2>
        <ul>
            <li><span class="key">MOUSE</span> MIRAR</li>
            <li><span class="key">W</span> ADELANTE</li>
            <li><span class="key">S</span> ATRÁS</li>
            <li><span class="key">A</span> PASO IZQ.</li>
            <li><span class="key">D</span> PASO DER.</li>
            <li><span class="key">SHIFT</span> CORRER</li>
        </ul>

        <div id="stamina-container">
            <div id="stamina-title">ESTAMINA</div>
            <div id="stamina-bg">
                <div id="stamina-fill"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('click-to-play');
    const staminaFill = document.getElementById('stamina-fill');
    const distanceHud = document.getElementById('distance-hud');
    const distValue = document.getElementById('dist-value');

    // CONFIGURACIÓN DE AUDIO EXTERNO
    const deathAudio = new Audio('jijijijaa.mp3'); 
    const mainEntityAudio = new Audio('queque.mp3'); 
    const rayoAudio = new Audio('rayopollito.mp3'); // <- NUEVO AUDIO

    // CONFIGURACIÓN DE IMÁGENES
    const stalkerImg = new Image();
    stalkerImg.src = 'monstruo.png'; 

    const shadowImg = new Image();
    shadowImg.src = 'miniqueque.png'; 

    const rayoImg = new Image();
    rayoImg.src = 'rayoxd.png';

    let spawnX = Math.floor(Math.random() * 200 - 100) + 0.5;
    let spawnY = Math.floor(Math.random() * 200 - 100) + 0.5;
    
    let playerX = spawnX;
    let playerY = spawnY;
    let dirX = 0.0; 
    let dirY = 1.0;
    let planeX = 0.66; 
    let planeY = 0.0; 
    
    const runSpeed = 0.07;
    const walkSpeed = runSpeed / 3;
    let currentSpeed = walkSpeed;
    const mouseSensitivity = 0.003; 

    const maxStamina = 100;
    let stamina = maxStamina;
    
    let time = 0; 
    let framesAlive = 0;
    let gameState = 'maze'; 
    let zBuffer = new Array(canvas.width); 

    // --- ESTADO DE LAS ENTIDADES ---
    let stalker = { active: false, x: 0, y: 0, speed: walkSpeed * 0.75 }; 
    let shadows = []; 
    let stalkerTriggerFrame = 7200; 

    const SEED = Math.random() * 10000;
    const mod = (n, m) => ((n % m) + m) % m;
    
    function hash(x, y) {
        let n = Math.sin((x + SEED) * 12.9898 + (y + SEED) * 78.233) * 43758.5453;
        return n - Math.floor(n);
    }

    const CHUNK_SIZE = 12; 

    function getMapBlock(x, y) {
        if (gameState === 'dark_realm') {
            if (hash(x, y) > 0.95) return 10; 
            return 0;
        }

        if (Math.abs(x - Math.floor(spawnX)) <= 2 && Math.abs(y - Math.floor(spawnY)) <= 2) return 0; 
        
        const h = hash(x, y);
        const chunkX = Math.floor(x / CHUNK_SIZE);
        const chunkY = Math.floor(y / CHUNK_SIZE);
        const chunkHash = hash(chunkX, chunkY);
        
        const localX = mod(x, CHUNK_SIZE);
        const localY = mod(y, CHUNK_SIZE);
        const centerX = 5.5; 

        if (chunkHash < 0.12) {
            if (localX === 0 || localX === CHUNK_SIZE - 1 || localY === 0 || localY === CHUNK_SIZE - 1) {
                if (Math.abs(localX - centerX) < 1 || Math.abs(localY - centerX) < 1) return 0; return 1; 
            }
            if ((localX >= 4 && localX <= 7 && localY >= 4 && localY <= 7)) return (h > 0.3) ? 7 : 0; 
            return 0; 
        } 
        else if (chunkHash < 0.24) return (mod(localX, 3) === 0 || mod(localY, 3) === 0) ? ((h > 0.75) ? 0 : 2) : 0;
        else if (chunkHash < 0.36) {
            if (localX === 0 || localX === CHUNK_SIZE - 1 || localY === 0 || localY === CHUNK_SIZE - 1) {
                if ((localX <= 2 || localX >= CHUNK_SIZE - 3) && (localY <= 2 || localY >= CHUNK_SIZE - 3)) return 0; return 3; 
            }
            if (mod(localX, 2) === 1 && mod(localY, 2) === 1) return 4; 
            return 0;
        }
        else if (chunkHash < 0.48) {
            if (localX === 0 || localX === CHUNK_SIZE - 1 || localY === 0 || localY === CHUNK_SIZE - 1) {
                if (Math.abs(localX - centerX) < 2 || Math.abs(localY - centerX) < 2) return 0; return 6; 
            }
            if (Math.abs(localX - centerX) < 1.5 && Math.abs(localY - centerX) < 1.5) return (h > 0.5) ? 0 : 5; 
            return 0;
        }
        else if (chunkHash < 0.60) return (mod(localX, 2) === 0 && mod(localY, 2) === 0) ? ((h > 0.3) ? 7 : 0) : 0;
        else if (chunkHash < 0.72) {
            const dist = Math.abs(localX - centerX) + Math.abs(localY - centerX);
            if (dist > 4.5 && dist < 7) { 
                if (Math.abs(localX - centerX) < 1 || Math.abs(localY - centerX) < 1) return 0; return 6; 
            }
            if (dist < 1.5) return 3; 
            return 0;
        }
        else if (chunkHash < 0.84) {
            if ((localY >= 3 && localY <= 4) || (localY >= 7 && localY <= 8)) {
                if (localX > 2 && localX < 9) return 0; return 3; 
            }
            return 0;
        }
        else if (chunkHash < 0.95) return (localX === 0 || localX === CHUNK_SIZE - 1 || localY === 0 || localY === CHUNK_SIZE - 1) ? ((h > 0.5) ? 0 : 5) : 0;
        
        else if (chunkHash < 0.96) return (h > 0.8) ? 8 : 0; 
        else if (chunkHash < 0.97) return (Math.sin(localX) + Math.cos(localY) > 0.5) ? 9 : 0; 
        else if (chunkHash < 0.98) return (h > 0.6) ? 10 : 0; 
        else if (chunkHash < 0.99) return (mod(localX, 4) === 0 && mod(localY, 4) === 0) ? 11 : 0; 
        else {
            if (localX === 0 || localX === CHUNK_SIZE - 1 || localY === 0 || localY === CHUNK_SIZE - 1) {
                if (Math.abs(localX - centerX) < 1 || Math.abs(localY - centerX) < 1) return 0;
                return 12; 
            }
            if (localX === localY || localX === CHUNK_SIZE - localY) return (h > 0.5) ? 0 : 12;
            return 0;
        }
    }

    function initDarkRealm() {
        gameState = 'dark_realm';
        distanceHud.style.display = 'none';
        
        shadows = [];
        for (let i = 0; i < 20; i++) {
            shadows.push({
                type: 'shadow',
                x: playerX + (Math.random() - 0.5) * 40,
                y: playerY + (Math.random() - 0.5) * 40,
                speed: walkSpeed * (0.1 + Math.random() * 0.1) 
            });
        }
    }

    function resetGame() {
        gameState = 'maze';
        framesAlive = 0;
        stalker.active = false;
        stalker.speed = walkSpeed * 0.75; 
        distanceHud.style.display = 'none';
        shadows = [];
        stamina = maxStamina;
        
        playerX = spawnX;
        playerY = spawnY;
    }

    canvas.addEventListener('click', async () => { if (!document.pointerLockElement) await canvas.requestPointerLock(); });
    document.addEventListener('pointerlockchange', () => { overlay.style.display = (document.pointerLockElement === canvas) ? 'none' : 'flex'; });
    
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === canvas) {
            let rot = -e.movementX * mouseSensitivity;
            const oldDirX = dirX;
            dirX = dirX * Math.cos(rot) - dirY * Math.sin(rot);
            dirY = oldDirX * Math.sin(rot) + dirY * Math.cos(rot);
            const oldPlaneX = planeX;
            planeX = planeX * Math.cos(rot) - planeY * Math.sin(rot);
            planeY = oldPlaneX * Math.sin(rot) + planeY * Math.cos(rot);
        }
    });

    const keys = { w: false, a: false, s: false, d: false, shift: false };
    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    function update() {
        if (gameState === 'maze') {
            framesAlive++;
            
            if (framesAlive > stalkerTriggerFrame && !stalker.active) {
                stalker.active = true;
                stalker.x = playerX - dirX * 15;
                stalker.y = playerY - dirY * 15;
                distanceHud.style.display = 'block';
            }

            if (stalker.active) {
                let dx = playerX - stalker.x;
                let dy = playerY - stalker.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                stalker.speed += 0.00005; 

                if (dist > 0) {
                    stalker.x += (dx / dist) * stalker.speed;
                    stalker.y += (dy / dist) * stalker.speed;
                }

                distValue.innerText = dist.toFixed(1);

                if (dist < 0.6) {
                    mainEntityAudio.play().catch(e => console.log("Audio bloqueado"));
                    initDarkRealm();
                }
            }

            // --- SISTEMA DETECCIÓN DE TOQUE DE MURO SORPRESA ---
            let pX = Math.floor(playerX);
            let pY = Math.floor(playerY);
            let touchedRayo = false;

            // Revisamos los bloques cercanos al jugador (un radio de 1 bloque)
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    let cX = pX + dx;
                    let cY = pY + dy;
                    if (getMapBlock(cX, cY) > 0) {
                        let isRayoWall = (hash(cX + 7.77, cY + 3.33) > 0.50);
                        if (isRayoWall) {
                            // Calcula la distancia desde el jugador a la pared más cercana del bloque
                            let distX = Math.max(cX, Math.min(playerX, cX + 1)) - playerX;
                            let distY = Math.max(cY, Math.min(playerY, cY + 1)) - playerY;
                            let distance = Math.sqrt(distX * distX + distY * distY);
                            
                            if (distance < 0.4) { 
                                touchedRayo = true;
                            }
                        }
                    }
                }
            }

            if (touchedRayo) {
                if (rayoAudio.paused || rayoAudio.ended) {
                    rayoAudio.play().catch(e => console.log("Audio bloqueado"));
                }
            }
        } 
        else if (gameState === 'dark_realm') {
            for (let s of shadows) {
                let dx = playerX - s.x;
                let dy = playerY - s.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                s.speed += 0.00005;

                if (dist > 0) {
                    s.x += (dx / dist) * s.speed;
                    s.y += (dy / dist) * s.speed;
                }

                if (dist < 0.5) {
                    deathAudio.play().catch(e => console.log("Audio bloqueado"));
                    resetGame();
                    return;
                }
            }
        }

        const isMoving = keys.w || keys.s || keys.a || keys.d;

        if (keys.shift && isMoving && stamina > 0) {
            currentSpeed = runSpeed; stamina -= 0.15; 
        } else {
            currentSpeed = walkSpeed; if (stamina < maxStamina) stamina += 0.05; 
        }
        
        if (stamina < 0) stamina = 0; if (stamina > maxStamina) stamina = maxStamina;

        staminaFill.style.width = `${stamina}%`;
        if (stamina > 50) staminaFill.style.background = '#00FF00'; 
        else if (stamina > 20) staminaFill.style.background = '#FFFF00'; 
        else staminaFill.style.background = '#FF0000'; 

        if (keys.w) {
            if (getMapBlock(Math.floor(playerX + dirX * currentSpeed * 2.5), Math.floor(playerY)) === 0) playerX += dirX * currentSpeed;
            if (getMapBlock(Math.floor(playerX), Math.floor(playerY + dirY * currentSpeed * 2.5)) === 0) playerY += dirY * currentSpeed;
        }
        if (keys.s) {
            if (getMapBlock(Math.floor(playerX - dirX * currentSpeed * 2.5), Math.floor(playerY)) === 0) playerX -= dirX * currentSpeed;
            if (getMapBlock(Math.floor(playerX), Math.floor(playerY - dirY * currentSpeed * 2.5)) === 0) playerY -= dirY * currentSpeed;
        }

        let strafeX = dirY; let strafeY = -dirX;

        if (keys.d) {
            if (getMapBlock(Math.floor(playerX + strafeX * currentSpeed * 2.5), Math.floor(playerY)) === 0) playerX += strafeX * currentSpeed;
            if (getMapBlock(Math.floor(playerX), Math.floor(playerY + strafeY * currentSpeed * 2.5)) === 0) playerY += strafeY * currentSpeed;
        }
        if (keys.a) {
            if (getMapBlock(Math.floor(playerX - strafeX * currentSpeed * 2.5), Math.floor(playerY)) === 0) playerX -= strafeX * currentSpeed;
            if (getMapBlock(Math.floor(playerX), Math.floor(playerY - strafeY * currentSpeed * 2.5)) === 0) playerY -= strafeY * currentSpeed;
        }
    }

    function drawSprites(spritesToDraw, w, h) {
        for (let i = 0; i < spritesToDraw.length; i++) {
            spritesToDraw[i].dist = (playerX - spritesToDraw[i].x) ** 2 + (playerY - spritesToDraw[i].y) ** 2;
        }
        spritesToDraw.sort((a, b) => b.dist - a.dist);

        for (let i = 0; i < spritesToDraw.length; i++) {
            let s = spritesToDraw[i];
            
            let spriteX = s.x - playerX;
            let spriteY = s.y - playerY;

            let invDet = 1.0 / (planeX * dirY - dirX * planeY);
            let transformX = invDet * (dirY * spriteX - dirX * spriteY);
            let transformY = invDet * (-planeY * spriteX + planeX * spriteY); 

            if (transformY > 0.1) { 
                let spriteScreenX = Math.floor((w / 2) * (1 + transformX / transformY));
                
                let sHeight = Math.abs(Math.floor(h / transformY));
                if (s.type === 'stalker') sHeight = Math.floor(sHeight * 1.2); 
                
                let drawStartY = Math.floor(-sHeight / 2 + h / 2);
                if (drawStartY < 0) drawStartY = 0;
                
                let drawEndY = Math.floor(sHeight / 2 + h / 2);
                if (drawEndY >= h) drawEndY = h - 1;

                let sWidth = sHeight / (s.type === 'stalker' ? 1.5 : 2);
                let drawStartX = Math.floor(-sWidth / 2 + spriteScreenX);
                let drawEndX = Math.floor(sWidth / 2 + spriteScreenX);

                for (let stripe = drawStartX; stripe < drawEndX; stripe += 2) {
                    if (stripe >= 0 && stripe < w && transformY < zBuffer[stripe]) {
                        
                        if (s.type === 'stalker') {
                            if (stalkerImg.complete && stalkerImg.naturalWidth !== 0) {
                                let texX = Math.floor((stripe - drawStartX) * stalkerImg.width / sWidth);
                                let texWidth = Math.max(1, Math.floor(2 * stalkerImg.width / sWidth));
                                
                                ctx.drawImage(
                                    stalkerImg, 
                                    texX, 0, texWidth, stalkerImg.height, 
                                    stripe, drawStartY, 2, drawEndY - drawStartY 
                                );
                            }
                        } else if (s.type === 'shadow') {
                            if (shadowImg.complete && shadowImg.naturalWidth !== 0) {
                                let texX = Math.floor((stripe - drawStartX) * shadowImg.width / sWidth);
                                let texWidth = Math.max(1, Math.floor(2 * shadowImg.width / sWidth));
                                
                                if (gameState === 'dark_realm') {
                                    ctx.globalAlpha = Math.max(0, 1 - transformY/8);
                                }
                                ctx.drawImage(
                                    shadowImg, 
                                    texX, 0, texWidth, shadowImg.height, 
                                    stripe, drawStartY, 2, drawEndY - drawStartY 
                                );
                                ctx.globalAlpha = 1.0;
                            }
                        }
                    }
                }
            }
        }
    }

    function draw() {
        const w = canvas.width;
        const h = canvas.height;

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);

        for (let x = 0; x < w; x += 2) { 
            let cameraX = 2 * x / w - 1;
            let rayDirX = dirX + planeX * cameraX;
            let rayDirY = dirY + planeY * cameraX;

            let mapX = Math.floor(playerX);
            let mapY = Math.floor(playerY);

            let sideDistX, sideDistY, deltaDistX = Math.abs(1 / rayDirX), deltaDistY = Math.abs(1 / rayDirY), perpWallDist;
            let stepX, stepY, hit = 0, side, wallType = 0;

            if (rayDirX < 0) { stepX = -1; sideDistX = (playerX - mapX) * deltaDistX; } else { stepX = 1; sideDistX = (mapX + 1.0 - playerX) * deltaDistX; }
            if (rayDirY < 0) { stepY = -1; sideDistY = (playerY - mapY) * deltaDistY; } else { stepY = 1; sideDistY = (mapY + 1.0 - playerY) * deltaDistY; }

            let maxDepth = (gameState === 'dark_realm') ? 15 : 40; 
            
            while (hit === 0 && maxDepth > 0) {
                if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; } else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
                wallType = getMapBlock(mapX, mapY);
                if (wallType > 0) hit = 1;
                maxDepth--;
            }

            if (hit === 1) {
                if (side === 0) perpWallDist = (mapX - playerX + (1 - stepX) / 2) / rayDirX; else perpWallDist = (mapY - playerY + (1 - stepY) / 2) / rayDirY;
            } else {
                perpWallDist = 9999; 
            }

            zBuffer[x] = perpWallDist;
            zBuffer[x+1] = perpWallDist;

            if (hit === 1) {
                let wallX;
                if (side === 0) wallX = playerY + perpWallDist * rayDirY; else wallX = playerX + perpWallDist * rayDirX;
                wallX -= Math.floor(wallX);

                let lineHeight = Math.floor(h / perpWallDist);
                let drawStart = -lineHeight / 2 + h / 2; if (drawStart < 0) drawStart = 0;
                let drawEnd = lineHeight / 2 + h / 2; if (drawEnd >= h) drawEnd = h - 1;

                let colorBase;
                if (gameState === 'dark_realm') {
                    let alpha = Math.max(0, 1 - perpWallDist/8);
                    colorBase = `rgba(30, 30, 30, ${alpha})`;
                    ctx.fillStyle = colorBase;
                    ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                } 
                else {
                    let isRayoWall = (hash(mapX + 7.77, mapY + 3.33) > 0.95);

                    if (isRayoWall && rayoImg.complete && rayoImg.naturalWidth !== 0) {
                        let texX = Math.floor(wallX * rayoImg.width);
                        if(texX < 0) texX = 0;
                        if(texX >= rayoImg.width) texX = rayoImg.width - 1;

                        ctx.drawImage(
                            rayoImg, 
                            texX, 0, 1, rayoImg.height, 
                            x, drawStart, 2, drawEnd - drawStart
                        );

                        if (side === 1) {
                            ctx.fillStyle = "rgba(0,0,0,0.4)";
                            ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                        }
                    } else {
                        if (wallType === 1) colorBase = "#0000FF";
                        else if (wallType === 2) colorBase = "#FF00FF";
                        else if (wallType === 3) colorBase = "#FF0000";
                        else if (wallType === 4) colorBase = "#FFFFFF";
                        else if (wallType === 5) colorBase = "#FFFF00";
                        else if (wallType === 6) colorBase = "#00FF00";
                        else if (wallType === 7) colorBase = "#FFA500";
                        else if (wallType === 8) colorBase = "#FFB6C1"; 
                        else if (wallType === 9) colorBase = "#4A0000"; 
                        else if (wallType === 10) colorBase = "#000000"; 
                        else if (wallType === 11) colorBase = "#000000"; 
                        else if (wallType === 12) colorBase = "#FFFFFF"; 
                        else colorBase = "#888888"; 

                        ctx.fillStyle = colorBase;
                        ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);

                        if (wallType >= 1 && wallType <= 7) {
                            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                            if ((wallX * 8) % 1 < 0.1) ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                            if (wallType % 2 === 0) {
                                for (let i = 1; i < 5; i++) { 
                                    let yH = drawStart + (drawEnd - drawStart) * (i / 5);
                                    if ((wallX * 4) % 1 < 0.5) ctx.fillRect(x, yH, 2, (drawEnd - drawStart) * 0.1);
                                }
                            } else {
                                for (let i = 1; i < 4; i++) { 
                                    let yH = drawStart + (drawEnd - drawStart) * (i / 4);
                                    ctx.fillRect(x, yH, 2, 4);
                                }
                            }
                        }

                        if (wallType === 8) {
                            let movingWall = (wallX + time * 0.005) % 1;
                            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                            if (movingWall < 0.3) ctx.fillRect(x, drawStart + lineHeight * 0.2, 2, lineHeight * 0.3);
                            if (movingWall > 0.6 && movingWall < 0.8) ctx.fillRect(x, drawStart + lineHeight * 0.6, 2, lineHeight * 0.2);
                            if (wallX > 0.45 && wallX < 0.55) { ctx.fillStyle = "#000"; ctx.fillRect(x, drawStart + lineHeight * 0.4 + Math.sin(time*0.05)*10, 2, lineHeight * 0.2); }
                        } 
                        else if (wallType === 9) {
                            ctx.fillStyle = "#8B0000"; 
                            if ((wallX * 10 + Math.sin(time*0.1)) % 2 < 0.5) ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                            if (wallX > 0.3 && wallX < 0.7) {
                                let eyeCenter = drawStart + lineHeight * 0.5;
                                ctx.fillStyle = "#FFF"; ctx.fillRect(x, eyeCenter - lineHeight * 0.15, 2, lineHeight * 0.3);
                                let pupilOffset = Math.sin(time * 0.1 + mapX) * 0.1;
                                if (wallX > 0.45 + pupilOffset && wallX < 0.55 + pupilOffset) {
                                    ctx.fillStyle = "#000"; ctx.fillRect(x, eyeCenter - lineHeight * 0.08, 2, lineHeight * 0.16);
                                    ctx.fillStyle = "red"; ctx.fillRect(x, eyeCenter - lineHeight * 0.02, 2, lineHeight * 0.04);
                                }
                            }
                        }
                        else if (wallType === 10) {
                            ctx.fillStyle = "#00FF00";
                            for (let yG = drawStart; yG < drawEnd; yG += (drawEnd - drawStart) / 10) {
                                if (Math.random() > 0.5) ctx.fillRect(x, yG, 2, (drawEnd - drawStart) / 10);
                            }
                        }
                        else if (wallType === 11) {
                            let dripHeight = 0.3 + 0.5 * Math.sin(wallX * 20 + mapX);
                            let animatedDrip = (time * 0.02 + dripHeight) % 1;
                            ctx.fillStyle = "#AA0000";
                            ctx.fillRect(x, drawStart, 2, lineHeight * animatedDrip);
                        }
                        else if (wallType === 12) {
                            ctx.fillStyle = "#000";
                            if ((wallX * 15) % 2 < 1) ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                            ctx.fillStyle = (Math.sin(time*0.2) > 0) ? "#FFF" : "#000";
                            ctx.fillRect(x, drawStart + lineHeight * 0.5, 2, lineHeight * 0.05);
                        }

                        if (side === 1 && wallType !== 10 && wallType !== 12) {
                            ctx.fillStyle = "rgba(0,0,0,0.4)";
                            ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                        }
                    }
                }

                let floorXWall, floorYWall;
                if (side === 0 && rayDirX > 0) { floorXWall = mapX; floorYWall = mapY + wallX; }
                else if (side === 0 && rayDirX < 0) { floorXWall = mapX + 1.0; floorYWall = mapY + wallX; }
                else if (side === 1 && rayDirY > 0) { floorXWall = mapX + wallX; floorYWall = mapY; }
                else { floorXWall = mapX + wallX; floorYWall = mapY + 1.0; }

                let drawEndActual = drawEnd;
                if (drawEndActual < 0) drawEndActual = h; 

                for (let y = drawEndActual + 1; y < h; y += 3) {
                    let currentDist = h / (2.0 * y - h);
                    
                    if (gameState === 'dark_realm') {
                        let alpha = Math.max(0, 1 - currentDist/8);
                        ctx.fillStyle = `rgba(15, 15, 15, ${alpha})`;
                        ctx.fillRect(x, y, 2, 3);
                        ctx.fillRect(x, h - y - 3, 2, 3); 
                    } else {
                        let weight = currentDist / perpWallDist;
                        let currentFloorX = weight * floorXWall + (1.0 - weight) * playerX;
                        let currentFloorY = weight * floorYWall + (1.0 - weight) * playerY;
                        
                        let checker = (Math.floor(currentFloorX * 4) + Math.floor(currentFloorY * 4)) % 2 === 0;
                        
                        ctx.fillStyle = checker ? "#444" : "#111";
                        ctx.fillRect(x, y, 2, 3);
                        ctx.fillStyle = checker ? "#112" : "#001";
                        ctx.fillRect(x, h - y - 3, 2, 3);
                    }
                }
            }
        }

        let spritesToDraw = [];
        if (gameState === 'maze' && stalker.active) {
            spritesToDraw.push({type: 'stalker', x: stalker.x, y: stalker.y});
        } 
        else if (gameState === 'dark_realm') {
            for (let s of shadows) spritesToDraw.push(s);
        }

        if (spritesToDraw.length > 0) {
            drawSprites(spritesToDraw, w, h);
        }

        if (gameState === 'maze') {
            let flashlight = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, h * 0.9);
            flashlight.addColorStop(0, "rgba(255, 255, 220, 0.0)"); 
            flashlight.addColorStop(0.5, "rgba(0, 0, 0, 0.5)");     
            flashlight.addColorStop(1, "rgba(0, 0, 0, 0.95)");      
            
            ctx.fillStyle = flashlight;
            ctx.fillRect(0, 0, w, h);
        } else if (gameState === 'dark_realm') {
            let flashlight = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, h * 0.85);
            flashlight.addColorStop(0, "rgba(255, 255, 255, 0.1)");
            flashlight.addColorStop(0.4, "rgba(0, 0, 0, 0.6)");     
            flashlight.addColorStop(1, "rgba(0, 0, 0, 1)");         
            
            ctx.fillStyle = flashlight;
            ctx.fillRect(0, 0, w, h);
        }
    }

    function gameLoop() {
        time++; 
        if (document.pointerLockElement === canvas) update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    gameLoop();
</script>
</body>
</html>
